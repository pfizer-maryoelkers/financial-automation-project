# configs/config_project.yaml
# ============================
# Configuration for the CapEx / Project pipeline.
# Uses WBS root codes (e.g. CE-BTS21076) as the top-level grouping key
# instead of Cost Center IDs.
# ============================

## Project Template (reader + writer share this)
template:
  file_path: "data/templates/Projects Financial Template.xlsx"
  header_row: 12
  po_col: "B"
  po_stop_marker: "Previous Period Invoices"
  wbs_col: "A"
  p3_id_col: "B"
  wbs_start_row: 2

# ============================
## Forecast Reader
forecast_reader:
  file_paths:
    - "data/forecasts/IBM Forecast_AP07_July 2026.xlsx"
  po_col: "PO #"

# ============================
## Transactional Detail Reader
# Transactional detail for projects uses the Consolidated Actuals file.
# Column aliases (Document Number / PO#, Fiscal Year/Period, etc.) are
# normalised automatically by TransactionalDetailReader.
transactional_detail_reader:
  file_path: "data/transactional/AP07 2026 Actuals Consolidated File PGS & ES.xlsx"
  required_cols:
    - "Amount - BER"
  valid_types:
    - "Actual"
    - "Accrual"
    - "Reversal"
    - "Reclass"
    - "ER"
  colmap:
    po: "PO Number"
    month: "Accounting Period"
    amount: "GL BER Corp Amount"
    classifier: "AP Voucher Number"
    cost_center: "Cost Center*"
    wbs: "WBS Element"
    legal_entity: "Legal Entity"
    vendor_name: "Vendor Name"
    gl_account: "Cost Element"
    req_title: "CO Doc Line Item Txt"
    type: "Type"

# ============================
## Template Writer
template_writer:
  output_path: "data/templates/template_project.xlsx"
  overwrite: False
  dec_acc_reversal_col: "N"
  forecast_source_cols:
    - "PO #"
    - "Jan 2026 - FTotal"
    - "Feb 2026 - FTotal"
    - "March 2026 - FTotal"
    - "April 2026 - FTotal"
    - "May 2026 - FTotal"
    - "June 2026 - FTotal"
    - "July 2026 - FTotal"
    - "Aug 2026 - FTotal"
    - "Sep 2026 - FTotal"
    - "Oct 2026 - FTotal"
    - "Nov 2026 - FTotal"
    - "Dec 2026 - FTotal"
  transactional_source_cols:
    - "PO Number"
    - "Accounting Period"
    - "AP Voucher Number"
    - "Vendor Name"
    - "WBS Element"
    - "GL Invoice Date"
    - "GL Posting Date"
    - "GL Line Description"
    - "Description"
    - "GL Transaction Amount"
    - "GL BER Corp Amount"
    - "Type"
